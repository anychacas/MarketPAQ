# MarketPAQ — stack de DESARROLLO LOCAL (solo para desarrollo)
#
#   docker compose -f docker-compose.dev.yml up -d
#       → inicia únicamente PostgreSQL (el backend normalmente se ejecuta en tu equipo con npm)
#
#   docker compose -f docker-compose.dev.yml --profile backend up -d
#       → también inicia el backend dentro de un contenedor (recarga en caliente, puerto 3000)
#
#   docker compose -f docker-compose.dev.yml down
#       → detiene y elimina los contenedores (conserva el volumen de la base de datos)
#
#   docker compose -f docker-compose.dev.yml down -v
#       → detiene todo Y borra el volumen de la base de datos
#
# Este archivo NO es el compose de producción a propósito:
#   - sin etiquetas de Traefik
#   - sin redes externas
#   - sin rutas en /opt
#   - las credenciales son valores desechables de desarrollo (marketpaq/marketpaq)
# El compose de producción está en infra/backend/docker-compose.yml — no lo edites.

name: marketpaq-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: marketpaq-dev-postgres
    restart: unless-stopped
    environment:
      # Credenciales desechables de desarrollo — nunca las reutilices en ningún otro lugar.
      POSTGRES_USER: marketpaq
      POSTGRES_PASSWORD: marketpaq
      POSTGRES_DB: marketpaq
    ports:
      # Solo está enlazado al bucle local: la base de datos de desarrollo nunca es accesible desde la LAN.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketpaq -d marketpaq"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # Opcional: solo se inicia cuando el perfil "backend" está habilitado.
    profiles: ["backend"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      # La etapa builder conserva las devDependencies (tsx, prisma CLI) para poder
      # observar el código fuente y ejecutar las migraciones dentro del contenedor.
      target: builder
    container_name: marketpaq-dev-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: "3000"
      HOST: 0.0.0.0
      LOG_LEVEL: info
      # Dentro de la red de compose, el host de la base de datos es el nombre del servicio.
      DATABASE_URL: postgresql://marketpaq:marketpaq@postgres:5432/marketpaq
      CORS_ORIGIN: http://localhost:5173
      # Secreto solo para desarrollo. Cámbialo si expones este stack a cualquier otra cosa.
      AUTH_SECRET: dev-only-insecure-secret-change-me
      ADMIN_EMAILS: admin@example.com
      MARKETPAQ_PUBLIC_URL: http://localhost:5173
      FRONTEND_BASE_URL: http://localhost:5173
      # Imprime los correos en el registro del contenedor en lugar de enviarlos.
      MAIL_MODE: log
      UPLOAD_DIR: /app/uploads
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - backend_uploads:/app/uploads
    command: sh -c "npx prisma migrate deploy && npm run dev"

volumes:
  postgres_dev_data:
  backend_uploads:
